<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>101 Okey</title>
<style>
body{margin:0;background:#0b5d3b;color:#fff;font:14px system-ui,sans-serif}
#A{max-width:1340px;margin:auto;padding:10px}
button,select,input{font:inherit;padding:6px 10px;border-radius:6px;border:0}
button{background:#f0b429;cursor:pointer;margin:2px}button:disabled{opacity:.4}
:root{--w:min(44px,4.6vw)}
.t{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:var(--w);height:calc(var(--w)*1.42);background:linear-gradient(#fbf4de,#eadfbd);border-radius:6px;font:700 calc(var(--w)*.52) system-ui;box-shadow:0 2px 0 #b9ad88,0 3px 4px #0005;color:#111}
.t i{font-style:normal;font-size:.55em;margin-top:1px}
.c0{color:#d62828}.c2{color:#1d4ed8}.c3{color:#e08a00}.w{outline:3px solid gold}
.sl{display:inline-flex;justify-content:center;align-items:flex-start;width:calc(var(--w) + 4px);height:calc(var(--w)*1.42 + 8px);padding-top:3px;box-sizing:border-box;border-radius:6px;background:#0003}
.sel .t{transform:translateY(-8px)}.pg .t{opacity:.35}
.box{background:#0003;border-radius:10px;padding:8px;margin:6px 0}
.me{outline:2px solid #f0b429}.grp{display:inline-block;margin:3px;padding:3px;background:#0004;border-radius:6px;cursor:pointer}
.grp{--w:26px}.grp small{display:block;font-size:10px;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
#msg{color:#ffd166;min-height:18px;text-align:center}

.tbl{position:relative;height:clamp(640px,calc(100vh - 130px),780px);background:radial-gradient(#0f7a4c,#0a5a38);border-radius:16px;overflow:hidden;margin:8px 0}
.pl{position:absolute;background:#073a26;border:2px solid #1d6a49;border-radius:20px;padding:4px 14px;font-weight:700;white-space:nowrap;z-index:2}
.pl.on{border-color:#f0b429;box-shadow:0 0 14px #f0b429aa}
.pl.tp{top:8px;left:50%;transform:translateX(-50%)}
.pl.l,.pl.r{top:38%;writing-mode:vertical-rl;padding:14px 5px}
.pl.l{left:8px;transform:rotate(180deg)}.pl.r{right:8px}
.pl.mine{position:static;display:inline-block}
.sg{position:absolute;width:calc(var(--w)*1.5);height:calc(var(--w)*2);border:2px dashed #ffffff45;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#0002}
.sg small{position:absolute;bottom:100%;margin-bottom:3px;font-size:11px;white-space:nowrap}
.sg.tl{top:56px;left:80px}.sg.tr{top:56px;right:80px}.sg.bl{bottom:285px;left:80px}.sg.br{bottom:285px;right:80px}
.t.act,.sg.act{outline:3px solid #f0b429;cursor:pointer;animation:pl 1s infinite alternate}
@keyframes pl{to{outline-color:#fff7}}
.ct{position:absolute;left:180px;right:180px;top:50px;bottom:280px;padding-top:34px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:auto}
.cc{display:flex;flex-direction:column;align-items:center;gap:3px}.cc small,.ct small{font-size:11px;opacity:.85}
.t.back{position:relative}
.bd{background:#f0b429;color:#000;border-radius:50%;width:calc(var(--w)*.72);height:calc(var(--w)*.72);display:flex;align-items:center;justify-content:center;font-size:calc(var(--w)*.3)}
.tg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;width:100%}
.bz{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:6px}
.rack{background:linear-gradient(#a8703a,#80501f);border-radius:8px;padding:8px 10px 2px;border-bottom:8px solid #5a3414;box-shadow:0 6px 14px #0007}
.rw{display:flex;margin-bottom:6px;background:#0002;border-radius:6px;padding:0 2px}
.dz{width:62px;height:104px;background:#073a26;border:2px solid #1d6a49;border-radius:10px;color:#fff;font-weight:700;font-size:12px;line-height:1.2;padding:4px}
.wrap{display:flex;gap:8px;align-items:flex-start}.wrap .tbl{flex:1;min-width:0}
.side{flex:0 0 230px;height:clamp(640px,calc(100vh - 130px),780px);overflow:auto;margin:8px 0;box-sizing:border-box;font-size:13px}
.lg{padding:4px 0;border-bottom:1px solid #ffffff18}.sd .t{outline:3px dashed #f0b429}
.ov{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5}
</style></head><body><div id="A"></div>
<script>
const A=document.getElementById('A'),P=localStorage.p||(localStorage.p=Math.random().toString(36).slice(2)+Date.now().toString(36)),R=new URLSearchParams(location.search).get('r');
let S=null,slots=Array(28).fill(null),sel=new Set(),pend=[],drag=null,msg='',rk=0,nm=localStorage.n||'',rt=0,lw=0,snd=localStorage.s!='0';
const CN=['Kırmızı','Siyah','Mavi','Sarı'];
async function api(t,x={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t,r:R,p:P,...x})});const j=await r.json();msg=j.err||'';if(!j.err){sel.clear()}draw();return j}
const E=t=>t.f?{c:S.g.o.c,n:S.g.o.n,w:0}:{c:t.c,n:t.n,w:+(t.c==S.g.o.c&&t.n==S.g.o.n)};
const tl=(t,x='')=>t?`<div class="t c${t.c} ${S.g&&E(t).w?'w':''} ${x}">${t.f?'✦':t.n+'<i>♥</i>'}</div>`:'';
if(R){const ev=new EventSource(`/ev?r=${R}&p=${P}`);ev.onmessage=e=>{const old=S;S=JSON.parse(e.data);rt=Date.now();msg='';sync();
 if(S.g&&!S.g.over&&S.g.turn==S.seat&&(!old||!old.g||old.g.turn!=S.seat||old.g.rk!=S.g.rk))beep(660,.12,2);
 if(S.chat&&old&&old.chat&&S.chat.length>old.chat.length&&S.chat[S.chat.length-1].s!=S.seat)beep(900,.08);draw()}}
function sync(){const g=S.g;if(!g)return;if(g.rk!=rk){rk=g.rk;slots=Array(28).fill(null);sel.clear();pend=[]}
 const h=g.hand.map(t=>t.id);slots=slots.map(x=>h.includes(x)?x:null);h.filter(i=>!slots.includes(i)).forEach(i=>slots[slots.indexOf(null)]=i);
 sel=new Set([...sel].filter(i=>h.includes(i)));pend=pend.map(a=>a.filter(i=>h.includes(i))).filter(a=>a.length)}
function build(h,order){let p=h.filter(t=>!E(t).w),G=[];
 const runs=()=>{for(let c=0;c<4;c++){const a=p.filter(t=>E(t).c==c),ns=[...new Set(a.map(t=>E(t).n))].sort((x,y)=>x-y);let i=0;
  while(i<ns.length){let j=i;while(j+1<ns.length&&ns[j+1]==ns[j]+1)j++;
   if(j-i>=2){const g=[];for(let k=i;k<=j;k++)g.push(a.find(x=>E(x).n==ns[k]&&p.includes(x)));G.push(g);p=p.filter(t=>!g.includes(t))}i=j+1}}};
 const sets=()=>{for(let n=1;n<=13;n++){const a=[];for(let c=0;c<4;c++){const t=p.find(x=>E(x).n==n&&E(x).c==c);t&&a.push(t)}if(a.length>=3){G.push(a);p=p.filter(t=>!a.includes(t))}}};
 order?(sets(),runs()):(runs(),sets());return{G,p}}
function arrange(mode){const h=S.g.hand,w=h.filter(t=>E(t).w);let G,p;
 if(mode=='seri'){const a=build(h,0),b=build(h,1);const r=a.G.flat().length>=b.G.flat().length?a:b;G=r.G;p=r.p}
 else{p=h.filter(t=>!E(t).w);G=[];const m={};p.forEach(t=>(m[E(t).c+'-'+E(t).n]=m[E(t).c+'-'+E(t).n]||[]).push(t));
  for(const k in m)while(m[k].length>=2){const pr=m[k].splice(0,2);G.push(pr);p=p.filter(t=>!pr.includes(t))}}
 p.sort((x,y)=>E(x).c-E(y).c||E(x).n-E(y).n);let it=[];G.forEach(g=>it.push(...g.map(t=>t.id),null));it.push(...p.map(t=>t.id),...w.map(t=>t.id));
 if(it.length>28)it=it.filter(x=>x!=null);slots=it.concat(Array(28).fill(null)).slice(0,28);sel.clear();draw()}
function home(){A.innerHTML=`<h1>101 Okey</h1><div class=box>Adın: <input id=nm value="${nm}"> <button onclick="mk()">Masa Kur</button></div><div id=msg>${msg}</div>`}
async function mk(){nm=document.getElementById('nm').value||'Oyuncu';localStorage.n=nm;const j=await api('new');if(j.id){await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:'join',r:j.id,p:P,name:nm})});location.href='?r='+j.id}}
function opts(){const o=S.opts,ro=S.seat!=S.hostSeat||(S.g&&!S.g.over)?'disabled':'';
 return `<div class=box><div class=row>
 <select ${ro} onchange="setO()" id=o1><option value=0 ${o.pair?'':'selected'}>Tekli</option><option value=1 ${o.pair?'selected':''}>Eşli (0-2 ve 1-3)</option></select>
 <select ${ro} onchange="setO()" id=o2><option value=0 ${o.katla?'':'selected'}>Katlamasız</option><option value=1 ${o.katla?'selected':''}>Katlamalı</option></select>
 <select ${ro} onchange="setO()" id=o3><option value=1 ${o.ceza?'selected':''}>İşlek taş cezası: Açık (+101)</option><option value=0 ${o.ceza?'':'selected'}>İşlek taş cezası: Kapalı</option></select>
 <select ${ro} onchange="setO()" id=o4>${[0,1,2,3].map(n=>`<option value=${n} ${o.bots==n?'selected':''}>Bot: ${n}</option>`).join('')}</select>
 <select ${ro} onchange="setO()" id=o5>${[[0,'Süresiz'],[30,'30 sn'],[45,'45 sn'],[60,'60 sn']].map(([v,l])=>`<option value=${v} ${o.sure==v?'selected':''}>Hamle süresi: ${l}</option>`).join('')}</select></div></div>`}
function setO(){api('opts',{o:{pair:+o1.value,katla:+o2.value,ceza:+o3.value,bots:+o4.value,sure:+o5.value}})}
function copy(){navigator.clipboard.writeText(location.href);msg='Link kopyalandı, arkadaşlarına gönder!';draw()}
function score(){const s=S.scores,n=S.names;return S.opts.pair?`<b>Takım A</b> (${n[0]||'-'}+${n[2]||'-'}): ${s[0]+s[2]} &nbsp; <b>Takım B</b> (${n[1]||'-'}+${n[3]||'-'}): ${s[1]+s[3]}`:n.map((x,i)=>`${x||'-'}: <b>${s[i]}</b>`).join(' &nbsp; ')}
function draw0(){
 if(!R)return home();if(!S)return A.innerHTML='Bağlanıyor…';if(S.err)return A.innerHTML=`<div class=box>${S.err}</div>`;
 const me=S.seat,g=S.g,top=`<div class=box><div class=row><input readonly size=36 value="${location.href}"><button onclick="copy()">Linki Kopyala</button><button onclick="snd=!snd;localStorage.s=+snd;draw()">${snd?'🔔 Ses açık':'🔕 Ses kapalı'}</button><span>${score()}</span></div></div>`;
 if(me<0){if(S.names.includes(null))return A.innerHTML=top+`<div class=box>Adın: <input id=nm value="${nm}"> <button onclick="nm=document.getElementById('nm').value||'Oyuncu';localStorage.n=nm;api('join',{name:nm})">Masaya Otur</button></div><div id=msg>${msg}</div>`;return A.innerHTML=top+'<div class=box>Masa dolu.</div>'}
 const lobby=`<div class=box><div class=row>${S.names.map((n,i)=>`<span class=box>${i+1}. ${dot(i)} ${n||'(boş)'}${i==S.hostSeat?' 👑':''}</span>`).join('')}</div></div>${opts()}${chat()}`;
 if(!g)return A.innerHTML=top+lobby+`<div class=row><button ${me==S.hostSeat&&!S.names.includes(null)?'':'disabled'} onclick="api('start')">Oyunu Başlat</button></div><div id=msg>${msg||(me==S.hostSeat?'4 oyuncu oturunca başlat.':'Kurucunun başlatması bekleniyor…')}</div>`;
 const my=g.turn==me&&!g.over,dr=my&&g.phase=='draw',play=my&&g.phase=='play',rel=k=>(me+k)%4,pv=g.disc[rel(3)],side=play&&g.side!=null;
 const pill=(i,c)=>`<div class="pl ${c} ${g.turn==i&&!g.over?'on':''}">${dot(i)} ${S.names[i]} · ${g.n[i]} taş${g.opened[i]?' ✅':''}</div>`;
 const slot=(k,c,x,oc)=>`<div class="sg ${c} ${x}" ${oc?`onclick="${oc}"`:''}><small>${S.names[rel(k)]}</small>${tl(g.disc[rel(k)])}</div>`;
 const rack=[0,14].map(r=>`<div class=rw>${slots.slice(r,r+14).map((id,k)=>{const i=r+k,t=id!=null&&g.hand.find(x=>x.id==id),p=pend.some(a=>a.includes(id));
  return `<span class="sl ${sel.has(id)?'sel':''} ${p?'pg':''} ${my&&g.side!=null&&id==g.side?'sd':''}" ondragover="event.preventDefault()" ondrop="slots[drag]!=null&&([slots[drag],slots[${i}]]=[slots[${i}],slots[drag]]);draw()">${t?`<span draggable=true ondragstart="drag=${i}" onclick="tg(${id})">${tl(t)}</span>`:''}</span>`}).join('')}</div>`).join('');
 const groups=g.table.map((x,i)=>`<span class=grp onclick="addT(${i})"><small>${S.names[x.o]}</small>${x.t.map(t=>tl(t)).join('')}</span>`).join('');
 const st=g.over?'El bitti':my?(dr?(g.noSide?'Sıra sende: desten taş çek':'Sıra sende: desten veya soldan taş çek'):side?'Yandan taş çektin: bu taşla el aç ya da geri bırak':'Sıra sende: aç, işle veya taş at'):'Sıra: '+S.names[g.turn];
 const ov=g.over?`<div class=ov><div class=box style="max-width:540px;text-align:center"><b>Sonuç:</b> ${g.over.w==null?'Berabere':S.names[g.over.w]+' bitirdi'}${g.over.dbl?' — OKEYLE bitti: çift açanların puanı 2 katı':''}<br>${S.names.map((n,i)=>n+': '+(g.over.d[i]>0?'+':'')+g.over.d[i]).join(' | ')}<br>${opts()}<button ${me==S.hostSeat?'':'disabled'} onclick="api('start')">Yeni El</button></div></div>`:'';
 const center=`<div class=ct><div class=row style="gap:26px;align-items:flex-end"><div class=cc>${tl(g.gos)}<small>Gösterge</small></div><div class=cc><div class="t back ${dr?'act':''}" ${dr?`onclick="api('drawDeck')"`:''}><b class=bd>${g.deck}</b></div><small>Deste</small></div></div>
 <div class=st>Okey: <b>${CN[g.o.c]} ${g.o.n}</b> · ${st}${g.tl!=null&&!g.over?' · ⏱ <b id=cd></b>':''}</div><div class=tg>${groups||'<small>Açılan seriler burada görünecek</small>'}</div>${g.table.length?'<small>İşlemek için 1 taş seç, sonra gruba tıkla</small>':''}</div>`;
 const acts=`<div class=row><button ${play&&sel.size>=2?'':'disabled'} onclick="pend.push([...sel]);sel.clear();draw()">Seçileni Grup Yap</button><button ${play&&pend.length?'':'disabled'} onclick="api('open',{gr:pend}).then(j=>{if(!j.err)pend=[];draw()})">Eli Aç (${pend.length} grup)</button><button ${pend.length?'':'disabled'} onclick="pend=[];draw()">Grupları Sıfırla</button><button ${play&&sel.size==1?'':'disabled'} onclick="api('discard',{tile:[...sel][0]})">Seçili Taşı At</button><button ${side?'':'disabled'} onclick="api('undo')">Yandan Çektiğimi Geri Bırak</button></div>`;
 let h=top+`<div class=wrap><div class="box side"><b>Olaylar</b>${S.log.slice().reverse().map(x=>`<div class=lg>${x}</div>`).join('')}</div><div class=tbl>${pill(rel(2),'tp')}${pill(rel(3),'l')}${pill(rel(1),'r')}${slot(2,'tl','','')}${slot(1,'tr','','')}${slot(3,'bl',dr&&pv&&!g.noSide?'act':'',dr&&pv&&!g.noSide?"api('drawDisc')":'')}${slot(0,'br',play&&sel.size==1?'act':'',play?"sel.size==1&&api('discard',{tile:[...sel][0]})":'')}${center}
 <div class=bz>${pill(me,'mine')}<div id=msg>${msg}</div>${acts}<div class=row style="flex-wrap:nowrap;gap:10px;align-items:center"><button class=dz onclick="arrange('cift')">▮▮<br>ÇİFT<br>DİZ</button><div class=rack>${rack}</div><button class=dz onclick="arrange('seri')">▮▮▮<br>SERİ<br>DİZ</button></div></div>${ov}</div></div>${chat()}`;
 A.innerHTML=h}
function tg(id){if(pend.some(a=>a.includes(id)))return;sel.has(id)?sel.delete(id):sel.add(id);draw()}
function addT(i){if(sel.size==1)api('add',{tile:[...sel][0],gi:i})}
const dot=i=>S.names[i]?(S.on[i]?'🟢':'🔴'):'',esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chat=()=>`<div class=box><div id=cb style="max-height:110px;overflow:auto">${S.chat.map(c=>`<div><b>${esc(c.n)}:</b> ${esc(c.m)}</div>`).join('')}</div><input id=ci placeholder="Mesaj yaz, Enter ile gönder" style="width:65%" onkeydown="if(event.key=='Enter')sc()"> <button onclick="sc()">Gönder</button></div>`;
function sc(){const i=document.getElementById('ci');if(i.value.trim()){fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:'chat',r:R,p:P,m:i.value})});i.value=''}}
function draw(){const i=document.getElementById('ci'),v=i?i.value:'',f=i&&document.activeElement==i;draw0();const n=document.getElementById('ci');if(n){n.value=v;f&&n.focus();const b=document.getElementById('cb');b.scrollTop=b.scrollHeight}}
let AC;function beep(f,d,n=1){if(!snd)return;try{AC=AC||new AudioContext();for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*d*1.3;o.frequency.value=f*(1+i*.25);g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}}catch(e){}}
setInterval(()=>{const g=S&&S.g;if(!g||g.tl==null||g.over)return;const da=rt+g.tl,l=Math.max(0,Math.ceil((da-Date.now())/1000)),c=document.getElementById('cd');if(c)c.textContent=l+' sn';
 if(g.turn==S.seat&&l>0&&l<=10&&Math.abs(da-lw)>3000){lw=da;beep(1200,.2)}},250);
draw();
</script></body></html>
